<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Записки Деда — №23</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="icon-btn" id="backBtn" aria-label="Назад">‹</button>
      <div>
        <div class="brand">ЗАПИСКИ ДЕДА</div>
        <div class="issue">№23 · 26 августа 2026</div>
      </div>
      <button class="icon-btn" id="shareBtn" aria-label="Поделиться">↗</button>
    </header>

    <section class="newspaper-wrap">
      <div class="newspaper" id="newspaper">
        <img src="gazeta23.jpg" alt="Выпуск №23 газеты Записки Деда">
        <button class="hotspot hs-main" data-section="main"></button>
        <button class="hotspot hs-fact" data-section="fact"></button>
        <button class="hotspot hs-thought" data-section="thought"></button>
        <button class="hotspot hs-advice" data-section="advice"></button>
        <button class="hotspot hs-humor" data-section="humor"></button>
        <button class="hotspot hs-today" data-section="today"></button>
        <button class="hotspot hs-story" data-section="story"></button>
        <button class="hotspot hs-poll" data-section="poll"></button>
      </div>
    </section>

    <div class="hint">Нажми на любую рубрику газеты 👆</div>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-section="main">📰<span>Главное</span></button>
      <button class="nav-btn" data-section="thought">👴<span>Дед</span></button>
      <button class="nav-btn" data-section="humor">😂<span>Юмор</span></button>
      <button class="nav-btn" data-section="poll">💬<span>Обсудить</span></button>
    </nav>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card">
      <button class="close" id="closeBtn">×</button>
      <div class="modal-kicker" id="modalKicker"></div>
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <div class="modal-actions">
        <button class="action" id="reactionBtn">😂 Нравится <span id="reactionCount">0</span></button>
        <button class="action" id="shareSectionBtn">↗ Поделиться</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
